#################################################
## MySQL serverId（v1.0.26+ 可自动生成，一般无需配置）
#################################################

# 是否启用 GTID
canal.instance.gtidon=false

# 主库地址（与主栈 MySQL 同 Docker 网络时用服务名，如 mysql:3306）
# 生产环境 beacon 库在远端 172.26.219.242，直连远端地址
# 注意：docker-compose 环境变量因含点号无法覆盖此项，必须直接在此文件修改
canal.instance.master.address=172.26.219.242:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=

# PolarDB-X 多流（未使用保持 false）
canal.instance.multi.stream.on=false

# 内置 H2 TSDB（与 canal.properties 中全局 TSDB 配合；实例级可覆盖）
canal.instance.tsdb.enable=true

# 复制账号（需 REPLICATION SLAVE、REPLICATION CLIENT 等权限）
# 账号密码需要跟hg_dnmpr/env/canal.env、hg_dnmpr/build/canal/config/canal.properties保持一致
canal.instance.dbUsername=${canal.instance.dbUsername:canal}
canal.instance.dbPassword=${canal.instance.dbPassword:canal}
canal.instance.connectionCharset = UTF-8
canal.instance.enableDruid=false

# 表订阅正则：当前为全库全表
# 若只订阅部分库可改为：beacon_dev\\..*|wechat_collect_dev\\..*|beacon_log_dev\\..*
canal.instance.filter.regex=.*\\..*
# 黑名单：系统库与复制相关表
canal.instance.filter.black.regex=mysql\\.slave_.*|information_schema\\..*|performance_schema\\..*|sys\\..*

#################################################
#########       RabbitMQ 路由（dynamicTopic）  #############
#################################################
# 按库名动态 routing key，格式 "routingKey:库名正则"，自上而下优先匹配
# 末条 .*\\..* 兜底，避免未匹配库的事件丢失
# 下游若单队列 binding "#"，可收到全部 routing key
canal.mq.dynamicTopic=beacon_dev_queue:beacon_dev\\..*,wechat_collect_queue:wechat_collect_dev\\..*,beacon_log_dev_queue:beacon_log_dev\\..*,canal_binlog_queue:.*\\..*
# 无 dynamicTopic 匹配时的兜底 topic
canal.mq.topic=canal_binlog_queue
canal.mq.partition=0
