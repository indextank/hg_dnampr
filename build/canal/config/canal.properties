#################################################
# Canal Server 主配置（本栈：serverMode=rabbitMQ）
#
# 配套文件：
#   - build/canal/config/example/instance.properties  主库地址、表过滤、dynamicTopic 等
#   - env/ 下 RabbitMQ 相关 env        建议与 rabbitmq.* 账号保持一致
#
# 修改后：需重启 Canal 容器/进程生效。
# 调优原则：先保证位点与订阅正确，再按延迟/CPU/内存逐步放大批量与缓冲区。
#################################################

#################################################
#########            通用参数                 #############
#################################################
# canal.ip
#   含义：Canal 对外提供 TCP（非 MQ）服务时绑定的网卡 IP。
#   建议：单机 Docker 通常留空；多网卡需固定某网卡时填写具体 IP。
canal.ip =
# canal.register.ip
#   含义：向 ZooKeeper 注册的客户端可见地址（与 canal.ip 可不同）。
#   建议：使用 ZK 做 HA 时，若自动探测不对再显式填写；无 ZK 可忽略。
canal.register.ip =
# canal.port / canal.metrics.pull.port
#   含义：Canal TCP 端口；metrics 拉取端口（监控用）。
#   建议：与宿主机/compose 端口映射一致即可；冲突则改端口并同步映射。
canal.port = 11111
canal.metrics.pull.port = 11112
# canal.user / canal.passwd
#   含义：客户端连 Canal TCP 时的认证（与 MQ 模式无直接关系）。
#   建议：仅在使用 Canal Client 直连时开启；MQ 模式可保持注释。
# canal.user = canal
# canal.passwd =

# Canal Admin
#   含义：内置管理 HTTP 端口与账号；global.manager.address 会引用 admin.manager。
#   建议：生产环境务必设置 canal.admin.passwd；仅内网访问或走反向代理。
#canal.admin.manager = 127.0.0.1:8089
canal.admin.port = 11110
canal.admin.user = ${canal.admin.user:}
canal.admin.passwd = ${canal.admin.passwd:}
#canal.admin.register.auto = true
#canal.admin.register.cluster =
#canal.admin.register.name =

# ZooKeeper
#   含义：Canal 集群协调与 HA；单机单节点常为空。
#   建议：多实例部署同一逻辑 Canal 时再配置 host:port 列表。
canal.zkServers =
# canal.zookeeper.flush.period（毫秒）
#   含义：ZK 元数据刷写间隔。
#   建议：默认即可；ZK 压力大时可略增大。
canal.zookeeper.flush.period = 1000
# canal.withoutNetty
#   含义：true 时不启 Netty（一般用于特殊嵌入场景）。
#   建议：常规部署保持 false。
canal.withoutNetty = false
# canal.serverMode
#   含义：消息出口类型；本仓库固定 rabbitMQ。
#   建议：勿改为 kafka/rocketMQ 等，除非同步改镜像与配置块。
canal.serverMode = rabbitMQ
# canal.file.data.dir / canal.file.flush.period
#   含义：位点、meta 等落盘目录；刷盘周期（毫秒）。
#   建议：数据目录挂卷持久化，避免容器重建丢位点；flush 过小会增加 IO。
canal.file.data.dir = ${canal.conf.dir}
canal.file.flush.period = 1000

## 内存队列（解析 → MQ 发送之间的 RingBuffer）
# canal.instance.memory.buffer.size
#   含义：环形队列槽位数，必须为 2^n；越大越能抗突发，内存占用越高。
#   建议：大事务/高峰 binlog 可适当加大（如 32768）；内存紧张则减小。
## memory.buffer.memunit
#   含义：估算每条 entry 占用的字节数，用于 MEMSIZE 批量判断。
#   建议：一般保持 1024；极大行宽场景可略增。
# canal.instance.memory.batch.mode
#   含义：MEMSIZE 按内存阈值取批；ITEMSIZE 按条数取批。
#   建议：默认 MEMSIZE 较平滑；需固定条数时再改 ITEMSIZE。
# canal.instance.memory.rawEntry
#   含义：是否保留原始 Entry 结构（与下游序列化/性能相关）。
#   建议：与当前 MQ 扁平消息配合时通常 true；异常时可查官方说明再改。
canal.instance.memory.buffer.size = 16384
canal.instance.memory.buffer.memunit = 1024
canal.instance.memory.batch.mode = MEMSIZE
canal.instance.memory.rawEntry = true

## 数据源探测（连不上主库时的重试逻辑）
# canal.instance.detecting.enable
#   含义：是否周期性执行 detecting.sql 探测连接。
#   建议：主库偶发抖动可开 true；稳定内网常关 false 减少开销。
# detecting.interval.time / retry.threshold
#   含义：探测间隔（秒）、连续失败次数阈值。
#   建议：避免过小导致刷屏日志；阈值按可容忍断连时间调。
canal.instance.detecting.enable = true
canal.instance.detecting.sql = select 1
canal.instance.detecting.interval.time = 3
canal.instance.detecting.retry.threshold = 3
canal.instance.detecting.heartbeatHaEnable = false

# canal.instance.transaction.size
#   含义：单个事务拆分投递的最大事件条数，超大事务会被切段。
#   建议：下游消费慢、单消息体大时略减小；吞吐优先且下游扛得住可略增。
canal.instance.transaction.size = 1024
# canal.instance.fallbackIntervalInSeconds
#   含义：主从切换等导致位点失效后的重连退避间隔（秒）。
#   建议：默认 60；频繁切换环境可略降以加快恢复（注意别打爆主库）。
canal.instance.fallbackIntervalInSeconds = 60

# 网络 SO 缓冲区与读超时
#   含义：与 MySQL binlog 连接的 socket 参数。
#   建议：跨机房或高延迟链路可适度增大 buffer；soTimeout 过小可能误杀长连接。
canal.instance.network.receiveBufferSize = 16384
canal.instance.network.sendBufferSize = 16384
canal.instance.network.soTimeout = 30

# Binlog 事件过滤（是否丢弃某类 SQL/行级事件）
#   含义：dcl/dml/ddl/query 等过滤；rows/transaction 等与行数据、事务边界相关。
#   建议：需要审计全量或 DDL 同步时保持 false；确定不要某类事件再逐项 true。
#   注意：与 instance 里 filter.regex 是不同层次（库表级 vs 事件类型）。
canal.instance.filter.druid.ddl = true
canal.instance.filter.query.dcl = false
canal.instance.filter.query.dml = false
canal.instance.filter.query.ddl = false
canal.instance.filter.table.error = false
canal.instance.filter.rows = false
canal.instance.filter.transaction.entry = false
canal.instance.filter.dml.insert = false
canal.instance.filter.dml.update = false
canal.instance.filter.dml.delete = false

# canal.instance.binlog.format / binlog.image
#   含义：允许的 binlog 格式；ROW 镜像 MINIMAL/FULL 等（依赖 MySQL 端 binlog_row_image）。
#   建议：主库应 binlog_format=ROW 且 image 与业务一致；Canal 侧一般保持默认列表。
canal.instance.binlog.format = ROW,STATEMENT,MIXED
canal.instance.binlog.image = FULL,MINIMAL,NOBLOB

# canal.instance.get.ddl.isolation
#   含义：true 时 DDL 单独成批，便于下游顺序处理。
#   建议：下游强依赖「先 DDL 再 DML」时可开 true；否则 false 吞吐更好。
canal.instance.get.ddl.isolation = false

# 并行解析
# canal.instance.parser.parallel
#   含义：是否多线程解析 binlog。
#   建议：CPU 核数充足时 true；单核极简环境可 false。
# parallelThreadSize：并行线程数，不配置则约为可用 CPU 的 60%。
# parallelBufferSize：Disruptor 环大小，须为 2^n。
#canal.instance.parser.parallelThreadSize = 16
canal.instance.parser.parallel = true
canal.instance.parser.parallelBufferSize = 256

# TSDB（表结构历史，用于解析 ROW 事件）
#   含义：内置 H2 存表元数据；dir/url 决定文件位置。
#   建议：持久化卷需覆盖 tsdb 目录；snapshot 周期与过期按磁盘与恢复需求调。
canal.instance.tsdb.enable = true
canal.instance.tsdb.dir = ${canal.file.data.dir:../conf}/${canal.instance.destination:}
canal.instance.tsdb.url = jdbc:h2:${canal.instance.tsdb.dir}/h2;CACHE_SIZE=1000;MODE=MYSQL;
canal.instance.tsdb.dbUsername = ${canal.instance.dbUsername:canal}
canal.instance.tsdb.dbPassword = ${canal.instance.dbPassword:canal}
canal.instance.tsdb.snapshot.interval = 24
canal.instance.tsdb.snapshot.expire = 360

#################################################
#########            实例（destination）       #############
#################################################
# canal.destinations
#   含义：启用的实例名列表，逗号分隔；每个名字对应（容器内）conf/<name>/instance.properties。
#   建议：新增实例时加名并建目录；删除实例时同步移除并清位点文件（谨慎）。
canal.destinations = example,wechat
canal.conf.dir = ../conf
# canal.auto.scan / auto.scan.interval（秒）
#   含义：是否热加载实例目录；扫描周期。
#   建议：需要动态增减实例时 true；极稳定环境可 false 避免误扫。
canal.auto.scan = true
canal.auto.scan.interval = 5
# canal.auto.reset.latest.pos.mode
#   含义：位点文件损坏或找不到时是否跳到最新 binlog。
#   建议：生产务必 false，避免丢数；仅测试环境可 true 快速起服。
canal.auto.reset.latest.pos.mode = false

canal.instance.tsdb.spring.xml = classpath:spring/tsdb/h2-tsdb.xml

# Spring 装配方式
#   含义：global.spring.xml 决定位点存储等；file-instance.xml 为文件位点（常用）。
#   建议：勿轻易改为 memory-instance（重启丢位点），除非明确只要内存模式。
canal.instance.global.mode = spring
canal.instance.global.lazy = false
canal.instance.global.manager.address = ${canal.admin.manager}
canal.instance.global.spring.xml = classpath:spring/file-instance.xml

##################################################
#########       MQ 公共参数（RabbitMQ 模式）    #############
##################################################
# canal.mq.flatMessage
#   含义：true 时发扁平 JSON 结构，便于消费方解析；false 为 Canal 原生格式。
#   建议：与现有 Syncer/消费者约定一致；不要随意切换以免反序列化失败。
# canal.mq.canalBatchSize
#   含义：每批从内存队列取出并构建 MQ 消息的最大条数（RabbitMQ 模式有效）。
#   建议：增大可提吞吐但单条消息体变大；配合 RabbitMQ 消息大小限制调整。
#   注意：canal.mq.batchSize 仅适用于 Kafka 模式，RabbitMQ 模式无效。
# canal.mq.canalGetTimeout（毫秒）
#   含义：从内存队列拉取时的等待超时。
#   建议：流量低时略增可减少空转；延迟敏感可略减。
canal.mq.flatMessage = true
canal.mq.canalBatchSize = ${canal.mq.canalBatchSize:50}
canal.mq.canalGetTimeout = ${canal.mq.canalGetTimeout:100}
# canal.mq.accessChannel
#   含义：local 为本地投递；cloud 用于阿里云消息轨迹等。
#   建议：自建 RabbitMQ 保持 local。
canal.mq.accessChannel = local

# canal.mq.database.hash
#   含义：是否按库名 hash，影响多分区/顺序语义（RabbitMQ 下与 routing 策略配合）。
#   建议：需要同库顺序时保持 true；单队列全量消费可按实测调 false。
# send.thread.size / build.thread.size
#   含义：发送 MQ 与构建消息的线程池大小。
#   建议：CPU 核数多、MQ RT 低时可适度加大；过大徒增上下文切换。
canal.mq.database.hash = true
canal.mq.send.thread.size = 30
canal.mq.build.thread.size = 8

# canal.mq.parallelThreadSize
#   含义：MQ 数据转换并行处理的并发度（1.1.5+ 版本支持）。
#   建议：CPU 核数充足时可适度加大，提高消息转换效率。
# canal.mq.parallelThreadSize = 8

##################################################
#########            RabbitMQ                 #############
##################################################
# rabbitmq.host / virtual.host / username / password
#   含义：Broker 地址、vhost、认证；password 建议走 env 注入而非明文落盘（部署层处理）。
#   建议：host 在 compose 网络内用服务名；与 management 中用户权限一致（含 publish 等）。
#   注意：以下配置会被 docker-compose 环境变量覆盖，实际值以 .env 文件为准
#   Canal 1.1.8 支持通过环境变量覆盖配置，环境变量使用下划线替代点号
#   例如：canal.mq.servers -> canal_mq_servers
rabbitmq.host = ${canal_mq_servers:rabbitmq}
rabbitmq.virtual.host = ${canal_mq_vhost:/}
rabbitmq.username = ${canal_mq_username:admin}
rabbitmq.password = ${canal_mq_password:}
# rabbitmq.deliveryMode
#   含义：与 Canal 发 RabbitMQ 的模式相关（如 topic 路由）。
#   建议：与 exchange 类型、下游 binding 一致；勿与 instance 中 dynamicTopic 混为一谈。
rabbitmq.deliveryMode = topic
# rabbitmq.exchange
#   含义：发布使用的交换机名称；需在 RabbitMQ 中预先声明或与策略一致。
#   建议：多环境隔离时用不同 exchange 名。
rabbitmq.exchange = canal.exchange
# rabbitmq.queue
#   含义：Canal 侧默认队列名（具体是否声明队列依赖版本/插件行为）；常与下游约定。
#   建议：与 Syncer 消费的队列名一致；多队列时用 binding + routing key 区分。
rabbitmq.queue = canal_binlog_queue
# rabbitmq.routingKey
#   含义：无 dynamicTopic 匹配时的默认 routing key。
#   建议：必须与 example/instance.properties 中 canal.mq.topic 保持一致，否则易丢路由。
rabbitmq.routingKey = canal_binlog_queue
