#
# ** THIS IS AN AUTO-GENERATED FILE **
#

# Kibana 优化配置文件
# 针对内存使用和性能进行优化

# 服务器配置
server.host: "0.0.0.0"
server.port: 5601
server.shutdownTimeout: "5s"
server.maxPayload: 1048576

# Elasticsearch 连接（使用kibana_system账号）
# 注意：实际协议由 docker compose 的 ELASTICSEARCH_HOSTS 环境变量覆盖
# dev 环境: http://elasticsearch:9200, prod 环境: https://elasticsearch:9200
# 此处仅作 fallback 默认值（env var 会优先生效）
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: ${ELASTICSEARCH_USERNAME}
elasticsearch.password: ${ELASTICSEARCH_PASSWORD}
# 与 docker-compose / elk.dev.env 中 ELASTICSEARCH_PINGTIMEOUT 对齐；过短易在 ES 繁忙时超时
elasticsearch.pingTimeout: 60000
elasticsearch.requestTimeout: 120000

# Elasticsearch SSL 配置
# prod 环境启用 SSL 时（ELK_HTTP_SSL_ENABLED=true）需要以下配置
# 证书由 docker-compose 挂载至 /usr/share/kibana/certs/
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/certs/ca/ca.crt"]
# dev 环境由 elk.dev.env 中 ELK_SSL_VERIFICATIONMODE=none 经 compose 注入覆盖
elasticsearch.ssl.verificationMode: certificate

# 禁用监控功能（减少内存使用）
monitoring.ui.container.elasticsearch.enabled: false
monitoring.enabled: false
monitoring.kibana.collection.enabled: false

# 禁用报告功能
xpack.reporting.enabled: false
# xpack.reporting.roles.* 自 Kibana 9.0 起被忽略（报告权限统一由 Kibana feature privileges 控制）

# 截图功能优化
xpack.screenshotting.browser.chromium.disableSandbox: true

# 性能优化
telemetry.enabled: false
telemetry.optIn: false
newsfeed.enabled: false

# 日志配置
logging.root.level: warn
# 按 logger 精细抑制已知的预期警告，避免淹没真正的错误
logging.loggers:
  # 开发环境使用 HTTP，secureCookies=false 属预期配置，无需反复提示
  - name: plugins.security.config
    level: error
  # 启动时 Task Manager 分区尚未分配属正常短暂状态，自行收敛
  - name: plugins.taskManager
    level: error
  # AI 助手需要 Platinum/Enterprise 许可证，开发环境不具备，已通过配置禁用
  - name: plugins.elasticAssistant.service
    level: error
  # ML 插件升级状态检测在开发环境中无法完成（无 ML 节点），属预期行为
  - name: plugins.ml
    level: error

# 本地化
i18n.locale: "zh-CN"

# 加密密钥：由 compose 环境变量 XPACK_*_ENCRYPTIONKEY 注入（取自 .env 的 KIBANA_ENCRYPTION_KEY，>=32 字符），
# kibana-docker 将其转换为命令行参数，优先级高于本文件；请勿在此写入明文密钥。
# 注意：更换该密钥会导致已加密的 saved objects 无法解密，轮换请使用 keyRotation.decryptionOnlyKeys。

# 安全配置优化（禁用 SSL）
server.ssl.enabled: false
# server.ssl.key: "/usr/share/kibana/config/certs/kibana/kibana.key"
# server.ssl.certificate: "/usr/share/kibana/config/certs/kibana/kibana.crt"
# server.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]
server.securityResponseHeaders.disableEmbedding: false

# 安全会话配置（开发环境）
# 注意：不要设置xpack.security.enabled，Kibana会自动检测Elasticsearch的安全状态
xpack.security.session.idleTimeout: "8h"
xpack.security.session.lifespan: "30d"
xpack.security.secureCookies: false
xpack.security.session.cleanupInterval: "1h"
server.securityResponseHeaders.strictTransportSecurity: null

# 禁用遥测数据收集
telemetry.allowChangingOptInStatus: false

# 优化保存对象
savedObjects.maxImportPayloadBytes: 10485760

# 禁用 Fleet 和 APM 功能（开发环境不需要）
xpack.fleet.enabled: false
xpack.apm.enabled: false
xpack.uptime.enabled: false

# 禁用 AI 助手功能（避免许可证警告）
xpack.observabilityAIAssistant.enabled: false

# 禁用 Profiling 功能（避免许可证警告）
xpack.profiling.enabled: false

# Task Manager 优化配置（减少对 Elasticsearch 的压力）
xpack.task_manager.poll_interval: 10000
xpack.task_manager.capacity: 5
xpack.task_manager.max_attempts: 2
xpack.task_manager.request_capacity: 500
xpack.task_manager.monitored_aggregated_stats_refresh_rate: 60000
xpack.task_manager.monitored_stats_health_verbose_log.enabled: false
xpack.task_manager.monitored_task_execution_thresholds.default.error_threshold: 90
xpack.task_manager.monitored_task_execution_thresholds.default.warn_threshold: 80
# 禁用ProductDocBase任务（避免网络错误）
xpack.task_manager.unsafe.exclude_task_types: ["ProductDocBase:EnsureUpToDate"]
