input {
  beats {
    port => 5044
  }

  # TCP 输入端口（可选）
  tcp {
    port => 5000
    codec => json_lines {
      # 设置解码大小限制为 20MB（解决警告）
      decode_size_limit_bytes => 20971520
    }
  }

  # HTTP 输入端口（可选）
  http {
    port => 8080
  }
}

filter {
  # 基本的日志处理
  if [fields][log_type] {
    mutate {
      add_tag => [ "%{[fields][log_type]}" ]
    }
  }

  # 处理时间戳
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # 移除不需要的字段（减少内存使用）
  mutate {
    remove_field => [ "host", "agent", "ecs" ]
  }
}

output {
  # 根据协议环境变量自动选择 HTTP 或 HTTPS 连接 Elasticsearch。
  # ELASTICSEARCH_PROTOCOL=http  → 不加载 SSL 配置，避免 Logstash 8.x 在 HTTP 下
  #                                 因 ssl_certificate_authorities 与明文连接冲突而报错。
  # ELASTICSEARCH_PROTOCOL=https → 启用 CA 校验，保证生产环境传输安全。
  if "${ELASTICSEARCH_PROTOCOL:http}" == "https" {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "logstash-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_certificate_authorities => ["${ELASTICSEARCH_SSL_CERTIFICATE_AUTHORITY:/usr/share/logstash/config/certs/ca/ca.crt}"]
      ssl_verification_mode => "full"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logstash-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      # HTTP 模式下不设置任何 ssl_* 参数，避免 Logstash 8.x 抛出
      # "SSL is not enabled" 或 "Could not read Elasticsearch" 配置错误
    }
  }

  # 调试输出（开发时启用）
  # stdout {
  #   codec => rubydebug
  # }
}
