# ==========================================
# RabbitMQ 项目自定义配置
# ==========================================
# 文件名前缀 20- 确保在 10-defaults.conf 之后加载
# 参考: https://www.rabbitmq.com/docs/configure#config-file

# ------------------------------------------
# 废弃功能显式声明
# ------------------------------------------
# RabbitMQ 4.x 废弃功能警告行为说明：
#   设置 permit = true  → 允许使用该功能，但 RabbitMQ 仍会在启动时打印 [warning]
#                          提醒该功能将在未来版本移除（这是 RabbitMQ 的设计行为，
#                          无法通过 permit 配置本身消除警告）。
#   设置 permit = false → 禁止使用该功能（Management UI 指标将不可用），警告不再出现。
#
# 消除警告的唯一方式：将日志级别提升到 error，或将 permit 设为 false（牺牲功能）。
# 当前选择：保留功能 + 提升日志级别为 error，在开发环境屏蔽此类噪音警告。

# management_metrics_collection：Management 插件指标收集（队列速率、连接统计等）
# 保持 true = 保留 Management UI 完整统计能力
deprecated_features.permit.management_metrics_collection = true

# AMQP 0-9-1 地址格式 v1（将被 v2 取代）
deprecated_features.permit.amqp_address_v1 = true

# global QoS（channel 级别 prefetch，将被 consumer 级别取代）
deprecated_features.permit.global_qos = true

# 瞬态非独占队列（transient non-exclusive queues）
deprecated_features.permit.transient_nonexcl_queues = true

# ------------------------------------------
# 日志级别
# ------------------------------------------
# RabbitMQ 4.x 的废弃功能警告无法通过 permit 配置消除，
# 在开发环境将默认日志级别提升为 error，屏蔽上述启动时的废弃通知警告。
# 生产环境建议保持 warning 级别以接收更多运行时诊断信息。
log.default.level = error

# 保留控制台输出（容器环境必须，10-defaults.conf 已设置，此处显式保留）
log.console = true
log.console.level = error

# ------------------------------------------
# 磁盘水位（disk free limit）
# ------------------------------------------
# 当磁盘可用空间低于该阈值时，RabbitMQ 会阻塞所有生产者（publisher）。
# 本项目曾有 /srv 写满导致 flood 的事故，此处显式设为 2GB 并持久化，
# 避免依赖 `rabbitmqctl set_disk_free_limit`（仅运行时生效，容器重建即丢失）。
# 注意：必须低于实际磁盘容量，且与运维扩容后的余量匹配。
disk_free_limit.absolute = 2GB
