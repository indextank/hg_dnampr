; 20261111: 启用 OPcache（扩展已随 PHP 源码编译进镜像，此处仅启用并调参）
; 不修改 php.ini，通过 conf.d 追加，避免被 up.sh 生成的 zz-profile-overrides.ini 覆盖
zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=320
opcache.interned_strings_buffer=48
opcache.max_accelerated_files=20000
; 发布后最多 2 秒生效，兼顾性能与上线及时性
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.file_update_protection=2
; 框架注解（Yii/Laravel docblock）依赖注释，必须保留
opcache.save_comments=1
opcache.fast_shutdown=0
opcache.max_wasted_percentage=10
; JIT 关闭：与 Swoole/大量 CLI 脚本组合下收益不稳定
opcache.jit=off
opcache.jit_buffer_size=0
