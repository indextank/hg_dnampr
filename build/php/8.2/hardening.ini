; 20261113: php专用：按要求放行 exec，其余危险函数保持禁用

disable_functions = passthru,exec,system,exec,shell_exec,proc_open,proc_get_status,popen,pcntl_exec,dl,ini_alter,ini_restore,openlog,syslog,chroot,chown,chgrp,putenv,symlink,link,stream_socket_server,pcntl_fork,parse_ini_file,apache_setenv,mb_send_mail,socket_create,posix_kill,highlight_file,phpinfo

; 隐藏 X-Powered-By 响应头，减少版本信息暴露
expose_php = Off
