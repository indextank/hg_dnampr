; exec 按项目既有约定放行；其余高风险进程、权限与信息泄露函数禁用。
; 该文件是全版本唯一真源，由 scripts/check-php-config-drift.sh 校验版本副本。

disable_functions = passthru,system,shell_exec,proc_open,proc_get_status,popen,pcntl_exec,dl,ini_alter,ini_restore,openlog,syslog,chroot,chown,chgrp,putenv,symlink,link,stream_socket_server,pcntl_fork,parse_ini_file,apache_setenv,mb_send_mail,socket_create,posix_kill,highlight_file,phpinfo

; 隐藏 X-Powered-By 响应头，减少版本信息暴露
expose_php = Off
