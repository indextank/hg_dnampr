apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    access:    proxy
    url:       http://syncer-prometheus:9090
    isDefault: true
    editable:  false

    jsonData:
      httpMethod:             POST
      manageAlerts:           true
      prometheusType:         Prometheus
      prometheusVersion:      2.52.0
      timeInterval:           15s
      queryTimeout:           60s
      exemplarTraceIdDestinations: []

    basicAuth: false
    withCredentials: false

  - name:      Loki
    type:      loki
    uid:       loki
    access:    proxy
    url:       http://syncer-loki:3100
    isDefault: false
    editable:  false
    jsonData:
      timeout: 60
      maxLines: 1000

  - name:      Alertmanager
    type:      alertmanager
    uid:       alertmanager
    access:    proxy
    url:       http://syncer-alertmanager:9093
    isDefault: false
    editable:  false
    jsonData:
      implementation: prometheus
