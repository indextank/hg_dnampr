# 示例：百友主控台（screen）站点。复制到 vhost/nginx_vhost/ 后 nginx reload 生效。
# 证书默认用 conf/ssl/rootCA（开发）；生产请换成正式证书路径。
server {
    listen 80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baiyou-screen.default.com;
    root /var/www/html/baiyou-project/screen/dist/;
    index index.html index.htm;
    charset utf-8;

    access_log /dev/null;
    error_log  /var/log/nginx/baiyou-screen.default.com_error_nginx.log warn;

    ssl_certificate /etc/nginx/conf/ssl/rootCA.pem;
    ssl_certificate_key /etc/nginx/conf/ssl/rootCA-key.pem;
    include /etc/nginx/conf/snippets/ssl-params.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /(\.user\.ini|\.ht|\.git|\.svn|\.project|LICENSE|README\.md) {
        deny all;
    }
}
