# 统一安全响应头（headers-more：不受 location 内 add_header 覆盖丢失）
# 由 nginx.conf http 块 include。HSTS 仍由各 HTTPS server 块维护（避免 HTTP 误发）。

more_set_headers "X-Frame-Options: SAMEORIGIN";
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=(), payment=()";
more_set_headers "Cross-Origin-Opener-Policy: same-origin";
# 现代浏览器以 CSP 为准；显式关闭过时的 XSS 过滤头，避免引入新问题
more_set_headers "X-XSS-Protection: 0";

# 基线 CSP：兼容现有 SPA；frame-ancestors / object-src / base-uri / form-action 收紧
more_set_headers "Content-Security-Policy: default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";

# $hsts_header 由 nginx.conf map $scheme 定义；HTTP 为空时 headers-more 不发送该头
more_set_headers "Strict-Transport-Security: $hsts_header";
