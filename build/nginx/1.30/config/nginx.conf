user www-data www-data;
worker_processes auto;

error_log  /var/log/nginx/error_nginx.log error;
pid        /var/run/nginx.pid;

worker_rlimit_nofile 65535;
events {
    # The effective method, used on Linux 2.6+, optmized to serve many clients with each thread.
    use epoll;
    # Determines how many clients will be served by each worker process.
    worker_connections 51200;
    # Accept as many connections as possible, after nginx gets notification about a new connection.
    multi_accept on;
}

http {
    log_format  main_ext  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$host" sn="$server_name" '
                    'rt=$request_time '
                    'ua="$upstream_addr" us="$upstream_status" '
                    'ut="$upstream_response_time" ul="$upstream_response_length" '
                    'cs=$upstream_cache_status' ;

    include /etc/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 1024m;
    client_body_buffer_size 10m;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 120;
    server_tokens off;
    tcp_nodelay on;

    # 隐藏指纹头；安全头改由 snippets/security-headers.conf 统一注入（勿再 clear）
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    more_clear_headers 'X-AspNet-Version';
    more_clear_headers 'X-AspNetMvc-Version';
    more_clear_headers 'X-Drupal-Cache';
    more_clear_headers 'X-Generator';

    # API CORS 白名单：仅列出明确前端源；未命中则为空（拒绝 *）
    map $http_origin $cors_allow_origin {
        default "";
        "~^https://beacon-dev\.default\.com$" $http_origin;
        "~^https://aems\.default\.com$" $http_origin;
        "~^https://baiyou-dev\.default\.com$" $http_origin;
        "~^https://baiyou-screen\.default\.com$" $http_origin;
        "~^https://clue-dev\.default\.com$" $http_origin;
        "~^https://dle\.default\.com$" $http_origin;
        "~^https://wp\.default\.com$" $http_origin;
        "~^https://localhost(:[0-9]+)?$" $http_origin;
        "~^https://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # HSTS 仅 HTTPS；用 more_set_headers 避免 location 内 add_header 冲掉
    map $scheme $hsts_header {
        default "";
        https "max-age=31536000; includeSubDomains; preload";
    }

    # 与 CORS Origin 白名单同步：仅命中时填充其余 CORS 头
    map $cors_allow_origin $cors_allow_credentials {
        default "";
        "~.+" "true";
    }
    map $cors_allow_origin $cors_allow_methods {
        default "";
        "~.+" "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }
    map $cors_allow_origin $cors_allow_headers {
        default "";
        "~.+" "Authorization, Content-Type, X-Requested-With, Accept, Origin, X-CSRF-Token";
    }
    map $cors_allow_origin $cors_allow_max_age {
        default "";
        "~.+" "86400";
    }

    include /etc/nginx/conf/snippets/security-headers.conf;

    fastcgi_connect_timeout 600;
    fastcgi_send_timeout 600;
    fastcgi_read_timeout 600;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_intercept_errors on;

    # 压缩配置（gzip/brotli/zstd）由入口脚本根据构建选项自动生成
    # 通过 /etc/nginx/conf.d/compression.conf 加载（由 *.conf 通配符自动 include）

    ##If you have a lot of static files to serve through Nginx then caching of the files' metadata (not the actual files' contents) can save some latency.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # redirect server error pages to the static page
    error_page 404             /404.html;
    error_page 500 502 503 504 /50x.html;

    log_format json escape=json '{"@timestamp":"$time_iso8601",'
                      '"server_addr":"$server_addr",'
                      '"remote_addr":"$remote_addr",'
                      '"scheme":"$scheme",'
                      '"request_method":"$request_method",'
                      '"request_uri": "$request_uri",'
                      '"request_length": "$request_length",'
                      '"uri": "$uri", '
                      '"request_time":$request_time,'
                      '"body_bytes_sent":$body_bytes_sent,'
                      '"bytes_sent":$bytes_sent,'
                      '"status":"$status",'
                      '"upstream_time":"$upstream_response_time",'
                      '"upstream_host":"$upstream_addr",'
                      '"upstream_status":"$upstream_status",'
                      '"host":"$host",'
                      '"http_referer":"$http_referer",'
                      '"http_user_agent":"$http_user_agent"'
                      '}';

######################## 安全默认配置 ############################

# 白名单模式：只允许明确配置的域名访问，其他一律静默拒绝
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # SSL配置（避免SSL连接错误）
    ssl_certificate /etc/nginx/conf/ssl/rootCA.pem;
    ssl_certificate_key /etc/nginx/conf/ssl/rootCA-key.pem;
    include /etc/nginx/conf/snippets/ssl-params.conf;

    # 完全禁用日志记录 - 静默拒绝所有未授权访问
    access_log off;
    error_log off;

    # 所有未配置的域名（包括localhost、127.0.0.1、IP直接访问等）
    # 一律返回204 No Content，不暴露任何信息
    location / {
        return 204;
    }

    # 仅保留必要的健康检查端点（仅限内网访问）
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker网络
        allow 10.0.0.0/8;     # 内网
        allow 192.168.0.0/16; # 内网
        deny all;
    }
}
    charset UTF-8;
    include /etc/nginx/conf.d/*.conf;

    # HSTS：各 HTTPS server 块保留
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 安全头 / CSP：见 snippets/security-headers.conf
    # API CORS：server 内 include snippets/cors-api.inc（依赖上方 $cors_allow_origin）
}
