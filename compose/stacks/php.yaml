version: '3.9'

# ==========================================
# PHP通用配置模板 (优化版)
# ==========================================
x-default-common: &default-common
    restart: unless-stopped # 更稳定的重启策略
    env_file:
        - ${ENV_DIR:-../../env}/base.env
        - ${ENV_DIR:-../../env}/web.env
        - ${ENV_DIR:-../../env}/php.env
        - ${ENV_DIR:-../../env}/mysql.env
        - ${ENV_DIR:-../../env}/postgres.env
        - ${ENV_DIR:-../../env}/mongodb.env
        - ${ENV_DIR:-../../env}/redis.env
        - ${ROOT_ENV_FILE:-../../.env}
        - ${ENV_DIR:-../../env}/container-strip-host-proxy.env
    environment:
        # 覆盖 env_file 中的 APACHE_LOG_DIR，避免 host 端路径污染容器内 Apache 配置
        APACHE_LOG_DIR: /etc/apache2/logs/apache
    dns:
        - ${DNS_PRIMARY:-223.5.5.5}
        - ${DNS_SECONDARY:-119.29.29.29}
    dns_opt:
        - use-vc
        - timeout:2
        - attempts:3
    # ICMP 需要 CAP_NET_RAW；部分环境会收紧默认能力，显式声明避免 ping 报 Operation not permitted
    cap_add:
        - NET_RAW
    # 日志配置优化
    logging:
        driver: 'json-file'
        options:
            max-size: '${LOG_MAX_SIZE:-50m}'
            max-file: '${LOG_MAX_FILE:-5}'
            compress: 'true'

    # 优化的健康检查配置
    healthcheck:
        test: ['CMD', 'pgrep', 'apache2']
        # test: ["CMD", "curl", "--fail", "--max-time", "5", "http://localhost:88/"]
        interval: 30s
        timeout: 15s # 增加超时时间
        retries: 3
        start_period: 90s # 增加启动时间，考虑编译缓存加载

    # 资源配置优化
    deploy:
        # 资源限制
        resources:
            limits:
                cpus: ${PHP_LIMITS_CPU:-4} # 增加默认CPU限制
                memory: ${PHP_LIMITS_MEMORY:-2G} # 增加默认内存限制
            reservations:
                memory: ${PHP_RESERVATIONS_MEMORY:-1G} # 增加默认内存预留

    # 安全配置 (在开发环境中暂时禁用以避免配置冲突)
    # security_opt:
    #   - no-new-privileges:true

    # 限制系统调用 (在主机网络模式下禁用，避免冲突)
    # sysctls:
    #   - net.core.somaxconn=1024
    #   - net.ipv4.ip_local_port_range=10000 65000

# PHP 镜像可选 nvm/Node 构建参数（变量来自 env/php.env；up.sh/build.sh 会导出）
x-php-nvm-build-args: &php-nvm-build-args
    PHP_IMAGE_INSTALL_NVM: ${PHP_IMAGE_INSTALL_NVM:-false}
    PHP_IMAGE_NODE_VERSION: ${PHP_IMAGE_NODE_VERSION:-25.9.0}
    PHP_IMAGE_NVM_NODE_MIRROR: ${PHP_IMAGE_NVM_NODE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/nodejs-release/}

# ==========================================
# 存储卷定义
# ==========================================
volumes:
    php_sessions:
        driver: local

services:
    ################  php85 #############################
    php85_apache:
        <<: *default-common
        container_name: php85_apache
        hostname: php85-apache
        image: hg_dnmpr_php85_apache:latest

        build:
            context: ../..
            dockerfile: build/php/8.5/Dockerfile
            network: host # 使用主机网络解决DNS问题
            args:
                # 基础配置
                PHP_VERSION: ${PHP85_VERSION}
                CHANGE_SOURCE: ${CHANGE_SOURCE}
                FALLBACK_MIRROR: ${FALLBACK_MIRROR:-}
                BUILD_PROXY_TYPE: ${BUILD_PROXY_TYPE:-none}
                PHP_EXTENSIONS: ${PHP_COMMON_EXTENSIONS}

                # 多架构支持
                BUILDPLATFORM: linux/amd64
                TARGETPLATFORM: linux/amd64

                # 库版本配置
                LIBWEBP_VERSION: ${LIBWEBP_VERSION}
                XDEBUG_EXT_VERSION: ${XDEBUG_EXT_VERSION}
                SWOOLE_EXT_VERSION: ${SWOOLE_EXT_VERSION}
                GRPC_EXT_VERSION: ${GRPC_EXT_VERSION}
                REDIS_EXT_VERSION: ${REDIS_EXT_VERSION}
                LIBRDKAFKA_VERSION: ${LIBRDKAFKA_VERSION}
                RDKAFKA_EXT_VERSION: ${RDKAFKA_EXT_VERSION}
                ZOOKEEPER_VERSION: ${ZOOKEEPER_VERSION}
                ZOOKEEPER_EXT_VERSION: ${ZOOKEEPER_EXT_VERSION}
                PROTOBUF_VERSION: ${PROTOBUF_VERSION}
                PROTOBUF_EXT_VERSION: ${PROTOBUF_EXT_VERSION}
                MONGODB_EXT_VERSION: ${MONGODB_EXT_VERSION}
                IMAGICK_EXT_VERSION: ${IMAGICK_EXT_VERSION}
                IMAGICK_VERSION: ${IMAGICK_VERSION}
                MEMCACHED_VERSION: ${MEMCACHED_VERSION}
                OPENSSL_VERSION: ${OPENSSL_VERSION}
                CURL_VERSION: ${CURL_VERSION}
                LIBSODIUM_VERSION: ${LIBSODIUM_VERSION}
                LIBICONV_VERSION: ${LIBICONV_VERSION}
                FREETYPE_VERSION: ${FREETYPE_VERSION}
                YAML_EXT_VERSION: ${YAML_EXT_VERSION}
                <<: *php-nvm-build-args

            # 构建参数优化
            shm_size: 1024m # 增加共享内存，加速编译

        # 存储卷配置 (优化版)
        volumes:
            # 应用代码 (只读挂载提高安全性)
            - ${GLOBAL_WEB_PATH}:/var/www/html:rw,Z

            # 日志目录 (专用卷)
            - ${APACHE_LOG_DIR}:/etc/apache2/logs/apache:rw,Z

            # PHP扩展安装日志目录
            - ../../logs/php-extensions:/var/log/php-extensions:rw,Z

            # 虚拟主机配置
            - ${APACHE_VHOST_DIR}:/etc/apache2/sites-enabled:ro,Z

            # PHP配置
            - ${PHP85_PHP_CONF_FILE}:/usr/local/etc/php/php.ini:ro,Z
            # PHP 运行时覆盖配置（由 up.sh 按 ENVIRONMENT 生成并挂载到 conf.d 生效）
            - ${PHP_PROFILE_INI_FILE:-../../build/php/common/zz-profile-overrides.ini}:/usr/local/etc/php/conf.d/zz-profile-overrides.ini:ro,Z

            # 缓存卷 (性能优化)
            - php_sessions:/tmp/php_sessions:rw

            # 临时文件优化
            - type: tmpfs
              target: /tmp/php_upload
              tmpfs:
                  size: 100m

        # 端口映射
        ports:
            - '${PHP85_PORT}:88'
        restart: unless-stopped # 或 always
        networks:
            - default
            - backend
        # 标签配置
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.php85.rule=Host(`${PHP85_SERVER_NAME}`)'
            - 'traefik.http.services.php85.loadbalancer.server.port=88'
            - 'com.project.environment=${ENVIRONMENT:-development}'
            - 'com.project.version=${VERSION:-latest}'

