version: '3.9'

# PHP 容器只接收非敏感项目默认值；应用账号和密钥放在被忽略的
# php-runtime.local.env 中。required:false 允许未配置业务密钥时安全启动。
x-php-runtime: &php-runtime
    restart: unless-stopped
    init: true
    user: '33:33'
    env_file:
        - ${ENV_DIR:-../../env}/base.env
        - ${ENV_DIR:-../../env}/web.env
        - ${ENV_DIR:-../../env}/php.env
        - path: ${PHP_RUNTIME_ENV_FILE:-../../php-runtime.local.env}
          required: false
        - ${ENV_DIR:-../../env}/container-strip-host-proxy.env
    environment:
        APACHE_LOG_DIR: /tmp/apache2/logs
        APACHE_RUN_DIR: /tmp/apache2/run
        APACHE_LOCK_DIR: /tmp/apache2/lock
        APACHE_PID_FILE: /tmp/apache2/run/apache2.pid
    dns:
        - ${DNS_PRIMARY:-223.5.5.5}
        - ${DNS_SECONDARY:-119.29.29.29}
    dns_opt: [use-vc, timeout:2, attempts:3]
    healthcheck:
        test: ['CMD', '/usr/local/bin/healthcheck.sh']
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
    stop_grace_period: 30s
    tmpfs:
        # 必须挂叶子目录：挂 /tmp/apache2 会遮住镜像内预建的 run/lock/logs。
        - /tmp/apache2/run:uid=33,gid=33,mode=0750
        - /tmp/apache2/lock:uid=33,gid=33,mode=0750
        - /tmp/apache2/logs:uid=33,gid=33,mode=0750
        - /tmp/php_sessions:uid=33,gid=33,mode=0700
        - /tmp/php_upload:uid=33,gid=33,mode=0700
    deploy:
        resources:
            limits:
                cpus: ${PHP_LIMITS_CPU:-4}
                memory: ${PHP_LIMITS_MEMORY:-2G}
            reservations:
                memory: ${PHP_RESERVATIONS_MEMORY:-1G}
    logging:
        driver: json-file
        options:
            max-size: ${LOG_MAX_SIZE:-50m}
            max-file: ${LOG_MAX_FILE:-5}
            compress: 'true'
    networks: [default, backend]

x-php-build-args: &php-build-args
    CHANGE_SOURCE: ${CHANGE_SOURCE:-false}
    FALLBACK_MIRROR: ${FALLBACK_MIRROR:-}
    BUILD_PROXY_TYPE: ${BUILD_PROXY_TYPE:-none}
    LIBWEBP_VERSION: ${LIBWEBP_VERSION}
    LIBAVIF_VERSION: ${LIBAVIF_VERSION}
    LIBAVIF_SHA256: ${LIBAVIF_SHA256}
    XDEBUG_EXT_VERSION: ${XDEBUG_EXT_VERSION}
    GRPC_EXT_VERSION: ${GRPC_EXT_VERSION}
    REDIS_EXT_VERSION: ${REDIS_EXT_VERSION}
    LIBRDKAFKA_VERSION: ${LIBRDKAFKA_VERSION}
    RDKAFKA_EXT_VERSION: ${RDKAFKA_EXT_VERSION}
    ZOOKEEPER_VERSION: ${ZOOKEEPER_VERSION}
    ZOOKEEPER_EXT_VERSION: ${ZOOKEEPER_EXT_VERSION}
    PROTOBUF_VERSION: ${PROTOBUF_VERSION}
    PROTOBUF_EXT_VERSION: ${PROTOBUF_EXT_VERSION}
    MONGODB_EXT_VERSION: ${MONGODB_EXT_VERSION}
    IMAGICK_EXT_VERSION: ${IMAGICK_EXT_VERSION}
    IMAGICK_VERSION: ${IMAGICK_VERSION}
    IMAGICK_SOURCE_SHA256: ${IMAGICK_SOURCE_SHA256}
    MEMCACHED_VERSION: ${MEMCACHED_VERSION}
    CURL_VERSION: ${CURL_VERSION}
    LIBSODIUM_VERSION: ${LIBSODIUM_VERSION}
    LIBICONV_VERSION: ${LIBICONV_VERSION}
    FREETYPE_VERSION: ${FREETYPE_VERSION}
    YAML_EXT_VERSION: ${YAML_EXT_VERSION}
    PHP_IMAGE_INSTALL_NVM: ${PHP_IMAGE_INSTALL_NVM:-false}
    PHP_IMAGE_NODE_VERSION: ${PHP_IMAGE_NODE_VERSION:-26.1.0}
    PHP_IMAGE_NVM_NODE_MIRROR: ${PHP_IMAGE_NVM_NODE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/nodejs-release/}

x-php-build: &php-build
    context: ../..
    dockerfile: build/php/common/Dockerfile
    shm_size: 1024m

services:
    php86_apache:
        <<: *php-runtime
        container_name: php86_apache
        hostname: php86-apache
        image: hg_dnmpr_php86_apache:latest
        build:
            <<: *php-build
            args:
                <<: *php-build-args
                PHP_VERSION: ${PHP86_VERSION}
                PHP_EXTENSIONS: ${PHP86_EXTENSIONS}
                SWOOLE_EXT_VERSION: ''
                REDIS_EXT_VERSION: ${PHP86_REDIS_EXT_VERSION}
                OPENSSL_VERSION: ${OPENSSL_VERSION}
        volumes:
            - ${GLOBAL_WEB_PATH}:/var/www/html:ro,Z
            - ${APACHE_VHOST_DIR}:/etc/apache2/sites-enabled:ro,Z
            - ${PHP86_PHP_CONF_FILE}:/usr/local/etc/php/php.ini:ro,Z
            - ${PHP86_HARDENING_INI_FILE:-../../build/php/common/hardening.ini}:/usr/local/etc/php/conf.d/zz-hardening.ini:ro,Z
            - ${PHP_OPCACHE_INI_FILE:-../../build/php/common/opcache.ini}:/usr/local/etc/php/conf.d/zz-opcache.ini:ro,Z
            - ${PHP_PROFILE_INI_FILE:-../../build/php/common/zz-profile-overrides.ini}:/usr/local/etc/php/conf.d/zz-profile-overrides.ini:ro,Z
        ports: ['${PHP86_PORT}:88']
        labels:
            - traefik.enable=true
            - 'traefik.http.routers.php86.rule=Host(`${PHP86_SERVER_NAME}`)'
            - traefik.http.services.php86.loadbalancer.server.port=88

