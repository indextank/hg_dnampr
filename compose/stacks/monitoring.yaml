# Monitoring stack for go-mysql-sync-es
# ---------------------------------------------------------------------------
# Prometheus + Grafana 监控栈，加入 hg_dnmpr_network 网络，
# 与 syncer、elasticsearch、mysql 等服务共享同一网络，通过服务名直接访问。
#
# 使用方法（在 hg_dnmpr 目录下执行）：
#   ./up.sh monitoring          # 启动监控栈（后台）
#   ./up.sh monitoring stop     # 停止监控栈
#   ./up.sh monitoring down     # 停止并删除容器（保留卷）
#   ./up.sh monitoring logs     # 查看日志
#
# 宿主机端口绑定由 MONITORING_PUBLISH_HOST 决定（up.sh/build.sh 根据
# env/base.env 中 ENVIRONMENT=development|production 自动设置）：
#   development → 127.0.0.1（仅本机）
#   production    → 0.0.0.0（可远程 IP:端口，须放行安全组/防火墙）
# 也可在运行前手动 export MONITORING_PUBLISH_HOST=0.0.0.0 覆盖。
#
# 访问地址（development 为本机）：
#   http://localhost:9090  – Prometheus UI
#   http://localhost:3000  – Grafana UI  (admin / admin)

name: hg_dnmpr_monitoring

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
    hg_dnmpr_network:
        external: true

# ---------------------------------------------------------------------------
# Persistent volumes
# ---------------------------------------------------------------------------
volumes:
    prometheus_data:
        driver: local
    grafana_data:
        driver: local
    alertmanager_data:
        driver: local
    loki_data:
        driver: local
    promtail_positions:
        driver: local

x-monitoring-env: &monitoring-env
    env_file:
        - ${ENV_DIR:-../../env}/base.env
        - ${ENV_DIR:-../../env}/mysql.env
        - ${ENV_DIR:-../../env}/postgres.env
        - ${ENV_DIR:-../../env}/mongodb.env
        - ${ENV_DIR:-../../env}/redis.env
        - ${ENV_DIR:-../../env}/timescaledb.env
        - ${ENV_DIR:-../../env}/pgvector.env
        - ${ENV_DIR:-../../env}/clickhouse.env
        - ${ENV_DIR:-../../env}/rabbitmq.env
        - ${ENV_DIR:-../../env}/syncer.env
        - ${ROOT_ENV_FILE:-../../.env}
        - ${ENV_DIR:-../../env}/container-strip-host-proxy.env
    dns:
        - ${DNS_PRIMARY:-223.5.5.5}
        - ${DNS_SECONDARY:-114.114.114.114}
    dns_opt:
        - use-vc
        - timeout:2
        - attempts:3
    # ICMP(ping) 需要 CAP_NET_RAW，显式声明避免运行环境默认能力收紧。
    cap_add:
        - NET_RAW

x-monitoring-logging: &monitoring-logging
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
    # ── Alertmanager ──────────────────────────────────────────────────────────
    alertmanager:
        <<: *monitoring-logging
        image: prom/alertmanager:v0.27.0
        container_name: syncer-alertmanager
        restart: unless-stopped
        command:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.listen-address=:9093"
        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/alertmanager/alertmanager.yml
              target: /etc/alertmanager/alertmanager.yml
              read_only: true
            - alertmanager_data:/alertmanager
        networks:
            - hg_dnmpr_network
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:9093/-/ready",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

    # ── Loki ──────────────────────────────────────────────────────────────────
    loki:
        <<: *monitoring-logging
        image: grafana/loki:2.9.8
        container_name: syncer-loki
        restart: unless-stopped
        command:
            - "-config.file=/etc/loki/loki.yml"
        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/loki/loki.yml
              target: /etc/loki/loki.yml
              read_only: true
            - loki_data:/loki
        networks:
            - hg_dnmpr_network

    # ── Promtail ──────────────────────────────────────────────────────────────
    promtail:
        <<: *monitoring-logging
        image: grafana/promtail:2.9.8
        container_name: syncer-promtail
        restart: unless-stopped
        depends_on:
            loki:
                condition: service_started
        command:
            - "-config.file=/etc/promtail/promtail.yml"
        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/promtail/promtail.yml
              target: /etc/promtail/promtail.yml
              read_only: true
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
            - type: bind
              source: /var/lib/docker/containers
              target: /var/lib/docker/containers
              read_only: true
            - promtail_positions:/tmp/promtail
        networks:
            - hg_dnmpr_network

    # ── Container / host metrics ──────────────────────────────────────────────
    cadvisor:
        <<: *monitoring-logging
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        container_name: syncer-cadvisor
        restart: unless-stopped
        privileged: true
        devices:
            - /dev/kmsg:/dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            - /dev/disk:/dev/disk:ro
        networks:
            - hg_dnmpr_network

    node-exporter:
        <<: *monitoring-logging
        image: prom/node-exporter:v1.8.2
        container_name: syncer-node-exporter
        restart: unless-stopped
        pid: host
        command:
            - "--path.rootfs=/host"
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
        volumes:
            - /:/host:ro,rslave
        networks:
            - hg_dnmpr_network

    blackbox-exporter:
        <<: *monitoring-logging
        image: prom/blackbox-exporter:v0.25.0
        container_name: syncer-blackbox-exporter
        restart: unless-stopped
        command:
            - "--config.file=/etc/blackbox_exporter/blackbox.yml"
        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/blackbox/blackbox.yml
              target: /etc/blackbox_exporter/blackbox.yml
              read_only: true
        networks:
            - hg_dnmpr_network

    # ── Service exporters ────────────────────────────────────────────────────
    mysql-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        image: prom/mysqld-exporter:v0.15.1
        container_name: syncer-mysql-exporter
        restart: unless-stopped
        entrypoint:
            - /bin/sh
            - -c
            - |
                set -e
                cat > /tmp/.my.cnf <<EOF
                [client]
                user=root
                password=$${MYSQL_ROOT_PASSWORD}
                host=mysql
                port=3306
                EOF
                exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
        networks:
            - hg_dnmpr_network

    mongo-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        image: percona/mongodb_exporter:0.40.0
        container_name: syncer-mongo-exporter
        restart: unless-stopped
        command:
            - "--mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME:-}:${MONGO_INITDB_ROOT_PASSWORD:-}@mongo:27017/admin"
            - "--collect-all"
        networks:
            - hg_dnmpr_network

    postgres-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        image: prometheuscommunity/postgres-exporter:v0.15.0
        container_name: syncer-postgres-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${PG_USER:-}:${PG_PASSWORD:-}@postgres:5432/postgres?sslmode=disable"
        networks:
            - hg_dnmpr_network

    redis-exporter:
        <<: *monitoring-logging
        image: oliver006/redis_exporter:v1.62.0
        container_name: syncer-redis-exporter
        restart: unless-stopped
        environment:
            REDIS_ADDR: "redis://redis:6379"
        networks:
            - hg_dnmpr_network

    valkey-exporter:
        <<: *monitoring-logging
        image: oliver006/redis_exporter:v1.62.0
        container_name: syncer-valkey-exporter
        restart: unless-stopped
        environment:
            REDIS_ADDR: "redis://valkey:6379"
        networks:
            - hg_dnmpr_network

    nginx-exporter:
        <<: *monitoring-logging
        image: nginx/nginx-prometheus-exporter:1.1.0
        container_name: syncer-nginx-exporter
        restart: unless-stopped
        command:
            - "--nginx.scrape-uri=http://nginx/nginx_status"
        networks:
            - hg_dnmpr_network

    tengine-exporter:
        <<: *monitoring-logging
        image: nginx/nginx-prometheus-exporter:1.1.0
        container_name: syncer-tengine-exporter
        restart: unless-stopped
        command:
            - "--nginx.scrape-uri=http://tengine/nginx_status"
        networks:
            - hg_dnmpr_network

    timescaledb-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        image: prometheuscommunity/postgres-exporter:v0.15.0
        container_name: syncer-timescaledb-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${TIMESCALE_USER:-postgres}:${TIMESCALE_PASSWORD:-}@timescaledb:5432/postgres?sslmode=disable"
        networks:
            - hg_dnmpr_network

    pgvector-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        image: prometheuscommunity/postgres-exporter:v0.15.0
        container_name: syncer-pgvector-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${PGVECTOR_USER:-postgres}:${PGVECTOR_PASSWORD:-}@pgvector:5432/postgres?sslmode=disable"
        networks:
            - hg_dnmpr_network

    clickhouse-exporter:
        <<: [*monitoring-env, *monitoring-logging]
        # ClickHouse 原生支持 Prometheus 端点（config.d 中已开启 9362），
        # 无需额外 exporter 进程；此处仅声明服务别名便于 file_sd 发现。
        # Prometheus 直接 scrape clickhouse:9362/metrics（见 prometheus.yml clickhouse job）。
        image: alpine:3.20
        container_name: syncer-clickhouse-exporter
        restart: "no"
        # 占位容器：ClickHouse 内置 metrics 端点由 prometheus 直接采集，
        # 此容器仅用于保持服务清单完整性与 file_sd target 引用一致性。
        entrypoint: ["echo", "clickhouse-exporter placeholder (metrics served by clickhouse:9362)"]
        networks:
            - hg_dnmpr_network

    # ── Prometheus ────────────────────────────────────────────────────────────
    prometheus:
        <<: *monitoring-logging
        image: prom/prometheus:v2.52.0
        container_name: syncer-prometheus
        restart: unless-stopped
        depends_on:
            alertmanager:
                condition: service_healthy

        environment:
            SYNCER_HOST: ${SYNCER_HOST:-syncer:8080}

        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--storage.tsdb.retention.size=5GB"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"

        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/prometheus/prometheus.yml
              target: /etc/prometheus/prometheus.yml
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/prometheus/rules
              target: /etc/prometheus/rules
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/prometheus/targets
              target: /etc/prometheus/targets
              read_only: true
            - prometheus_data:/prometheus

        ports:
            - "${MONITORING_PUBLISH_HOST:-127.0.0.1}:9090:9090"

        networks:
            - hg_dnmpr_network

        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:9090/-/ready",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

    # ── Grafana ───────────────────────────────────────────────────────────────
    grafana:
        <<: *monitoring-logging
        image: grafana/grafana-oss:10.4.2
        container_name: syncer-grafana
        restart: unless-stopped
        depends_on:
            prometheus:
                condition: service_healthy
            loki:
                condition: service_started

        entrypoint:
            - /bin/sh
            - -c
            - |
                set -e
                echo "[entrypoint] Resolving DS_PROMETHEUS placeholder in dashboard JSON..."
                sed 's/\$${DS_PROMETHEUS}/prometheus/g' \
                    /tmp/grafana-dashboards/syncer-dashboard.json \
                    > /etc/grafana/provisioning/dashboards/syncer-dashboard.json
                cp /tmp/grafana-dashboards/project-overview-dashboard.json \
                    /etc/grafana/provisioning/dashboards/project-overview-dashboard.json
                cp /tmp/grafana-dashboards/mysql-overview-dashboard.json \
                    /etc/grafana/provisioning/dashboards/mysql-overview-dashboard.json
                cp /tmp/grafana-dashboards/mongodb-overview-dashboard.json \
                    /etc/grafana/provisioning/dashboards/mongodb-overview-dashboard.json
                echo "[entrypoint] Dashboard written – starting Grafana..."
                exec /run.sh

        environment:
            GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-}
            GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-}
            GF_SERVER_HTTP_PORT: "3000"
            GF_SERVER_PROTOCOL: http
            GF_PATHS_DATA: /var/lib/grafana
            GF_PATHS_LOGS: /var/log/grafana
            GF_PATHS_PLUGINS: /var/lib/grafana/plugins
            GF_PATHS_PROVISIONING: /etc/grafana/provisioning
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_ALERTING_ENABLED: "false"
            GF_UNIFIED_ALERTING_ENABLED: "true"
            GF_METRICS_ENABLED: "true"
            GF_USERS_DEFAULT_LANGUAGE: zh-Hans
            GF_INSTALL_PLUGINS: ""
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

        volumes:
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/provisioning/datasources
              target: /etc/grafana/provisioning/datasources
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/provisioning/dashboards/provider.yaml
              target: /etc/grafana/provisioning/dashboards/provider.yaml
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/syncer-dashboard.json
              target: /tmp/grafana-dashboards/syncer-dashboard.json
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/project-overview-dashboard.json
              target: /tmp/grafana-dashboards/project-overview-dashboard.json
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/mysql-overview-dashboard.json
              target: /tmp/grafana-dashboards/mysql-overview-dashboard.json
              read_only: true
            - type: bind
              source: ${BUILD_ROOT:-../../build}/monitoring/grafana/mongodb-overview-dashboard.json
              target: /tmp/grafana-dashboards/mongodb-overview-dashboard.json
              read_only: true
            - grafana_data:/var/lib/grafana

        ports:
            - "${MONITORING_PUBLISH_HOST:-127.0.0.1}:3000:3000"

        networks:
            - hg_dnmpr_network

        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:3000/api/health",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
