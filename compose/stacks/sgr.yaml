name: hg_dnmpr_sgr

x-common-variables: &default-common
    restart: unless-stopped
    env_file:
        - ${ENV_DIR:-../../env}/base.env
        - ${ENV_DIR:-../../env}/apps.env
        - ${ENV_DIR:-../../env}/mysql.env
        - ${ENV_DIR:-../../env}/postgres.env
        - ${ENV_DIR:-../../env}/mongodb.env
        - ${ROOT_ENV_FILE:-../../.env}
        - ${ENV_DIR:-../../env}/container-strip-host-proxy.env
    dns:
        - ${DNS_PRIMARY:-223.5.5.5}
        - ${DNS_SECONDARY:-114.114.114.114}
    dns_opt:
        - use-vc
        - timeout:2
        - attempts:3
    # ICMP(ping) 需要 CAP_NET_RAW，显式声明避免运行环境默认能力收紧。
    cap_add:
        - NET_RAW

services:
    ################################  Spug  ###################################
    spug:
        <<: *default-common
        image: openspug/spug-service
        container_name: spug
        privileged: true
        volumes:
            # 沿用现有 spug 容器的本地数据目录（/data/spug/service 和 /data/spug/repos）
            # 完整路径 = ${DATA_PATH_HOST}/${SPUG_DATA_SUBDIR}（由 Compose 运行时拼装）
            # 留空 SPUG_DATA_DIR → 自动按上述规则拼装
            - ${SPUG_DATA_DIR:-${DATA_PATH_HOST}/${SPUG_DATA_SUBDIR}}/service:/data/spug
            - ${SPUG_DATA_DIR:-${DATA_PATH_HOST}/${SPUG_DATA_SUBDIR}}/repos:/data/repos
        ports:
            # 如果80端口被占用可替换为其他端口，例如: - "8000:80"
            - "${SPUG_PORT}:80"
        environment:
            MYSQL_DATABASE: ${SPUG_DB_DATABASE}
            MYSQL_USER: ${SPUG_DB_USER}
            MYSQL_PASSWORD: ${SPUG_DB_PASSWORD}
            MYSQL_HOST: ${SPUG_DB_ENGINE}
            MYSQL_PORT: ${SPUG_DB_PORT}
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 1G
                reservations:
                    memory: 512M
        networks:
            - lnamp_network

    ################################  Gitea ###################################
    gitea:
        <<: *default-common
        image: gitea/gitea:1.22.6
        container_name: gitea
        environment:
            USER_UID: 1000
            USER_GID: 1000
            GITEA__database__DB_TYPE: ${GITEA_DB_ENGINE}
            GITEA__database__HOST: ${GITEA_DB_ENGINE}:${GITEA_DB_PORT}
            GITEA__database__NAME: ${GITEA_DB_DATABASE}
            GITEA__database__USER: ${GITEA_DB_USER}
            GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
        networks:
            - lnamp_network
        volumes:
            # 沿用现有 gitea 容器的本地数据目录
            # 完整路径 = ${DATA_PATH_HOST}/${GITEA_DATA_SUBDIR}（由 Compose 运行时拼装）
            - ${DATA_PATH_HOST}/${GITEA_DATA_SUBDIR}:/data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - "${GITEA_PORT}:3000"
            - "${GITEA_SSH_PORT}:22"

    ################################  rap接口平台 ####################
    # frontend
    rap2-dolores:
        image: rapteam/rap2-dolores:latest
        container_name: rap2-dolores
        ports:
            #冒号前可以自定义前端端口号，冒号后不要动
            - ${RAP2_FRONTEND_PORT}:38081
    # backend
    rap2-delos:
        image: rapteam/rap2-delos:latest
        container_name: rap2-delos
        ports:
            # 这里的配置不要改哦
            - 38080:38080
        environment:
            SERVE_PORT: 38080
            # if you have your own mysql, config it here, and disable the 'mysql' config blow
            MYSQL_URL: mysql # links will maintain /etc/hosts, just use 'container_name'
            # 容器间通信使用容器内端口，而非宿主机映射端口变量
            MYSQL_PORT: 3306
            MYSQL_USERNAME: ${RAP2_MYSQL_USER}
            MYSQL_PASSWD: ${RAP2_MYSQL_PASSWORD}
            MYSQL_SCHEMA: ${RAP2_MYSQL_SCHEMA}
            # redis config
            REDIS_URL: redis
            REDIS_PORT: 6379
            # production / development
            NODE_ENV: production
        networks:
            - lnamp_network
        ###### 'sleep 30 && node scripts/init' will drop the tables
        ###### RUN ONLY ONCE THEN REMOVE 'sleep 30 && node scripts/init'
        command: /bin/sh -c 'node dispatch.js'
        # init the databases
        # command: sleep 30 && node scripts/init && node dispatch.js
        # without init
        # command: node dispatch.js

networks:
    lnamp_network:
        external: true
        name: hg_dnmpr_network
