# ========================
# 生产环境专用配置说明
# ========================
# 特性：
# 1. 支持按服务调整副本（与固定 container_name/宿主机端口并存的服务须保持 replicas=1，见各服务注释）
# 2. 资源配额限制与预留
# 3. 滚动更新策略
# 4. 生产级日志管理
# 5. 云原生存储配置

# PHP 运行时性能（生产环境）：将 env/php.env 的 PHP_PROD_* 映射为容器内统一变量名，
# 当 ENVIRONMENT=production 选中本 overlay 时自动加载。
# 真正写入 php.ini 的覆盖由 up.sh 生成 zz-profile-overrides.ini 并挂载到容器 conf.d。
x-php-perf-env: &php-perf-env
  PHP_MEMORY_LIMIT: ${PHP_PROD_MEMORY_LIMIT:-2048M}
  PHP_MAX_EXECUTION_TIME: ${PHP_PROD_MAX_EXECUTION_TIME:-60}
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_PROD_UPLOAD_MAX_FILESIZE:-128M}
  PHP_POST_MAX_SIZE: ${PHP_PROD_POST_MAX_SIZE:-128M}
  PHP_MAX_INPUT_VARS: ${PHP_PROD_MAX_INPUT_VARS:-5000}
  PHP_DISPLAY_ERRORS: ${PHP_PROD_DISPLAY_ERRORS:-Off}
  PHP_ERROR_REPORTING: "${PHP_PROD_ERROR_REPORTING:-E_ALL & ~E_DEPRECATED}"

services:
  nginx:
    extends:
      file: stacks/web.yaml
      service: nginx-server
    deploy:
      # 与 compose/stacks/web.yaml 中 container_name + 宿主机 ports 映射并存时，replicas 必须为 1（Compose 校验）
      # 多副本需去掉固定 container_name，并解决端口/数据卷冲突（如前置 LB、Swarm/K8s）
      replicas: ${NGINX_PROD_REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        # 生产资源配额（根据实际负载调整）
        limits:
          cpus: ${NGINX_PROD_LIMITS_CPU:-1} # 最大CPU核心数
          memory: ${NGINX_PROD_LIMITS_MEMORY:-512M} # 最大内存限制
        reservations:
          cpus: ${NGINX_PROD_RESERVATIONS_CPU:-0.5} # 预留CPU核心数
          memory: ${NGINX_PROD_RESERVATIONS_MEMORY:-256M} # 预留内存
    logging:
      driver: "json-file" # 生产环境建议使用 gelf, fluentd 等
      options:
        # 生产日志配置（WARN级别）
        max-size: "100m" # 建议值：100-500MB
        max-file: "5" # 建议值：5-10个文件
        # tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

