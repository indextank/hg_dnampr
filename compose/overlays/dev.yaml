          memory: ${PHP_DEV_LIMITS_MEMORY:-256M}
        reservations:
          cpus: ${PHP_DEV_RESERVATIONS_CPU:-0.1}
          memory: ${PHP_DEV_RESERVATIONS_MEMORY:-128M}
