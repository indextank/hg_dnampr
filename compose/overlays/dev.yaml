  php84_apache:
    extends:
      file: stacks/php.yaml
      service: php84_apache
    environment:
      <<: *php-perf-env
    # ── 方案A：开发环境端口直连 ──
    # 通过 env 变量控制端口映射，默认覆盖 Hyperf HTTP Server 集群端口段
    # 修改 env/php.env 中 PHP84_HYPERF_PORT / PHP84_HYPERF_PORT_END 可调整端口范围
    ports:
      - "9901-9903:9901-9903" # Dev-only: Hyperf HTTP Server集群端口段
    # ── 方案D：Traefik 动态路由 ──
    # 需 Traefik 容器已加入 hg_dnmpr_network；未部署时 labels 无害，方案A 端口直连仍可用
    labels:
      - "traefik.http.routers.php84-hyperf.rule=Host(`${PHP84_HYPERF_SERVER_NAME:-php84-hyperf.default.com}`)"
      - "traefik.http.services.php84-hyperf.loadbalancer.server.port=9901"
    deploy:
      # 开发环境保持单副本，避免资源浪费
      # 建议值范围：1-2（本地多服务联调时可临时调整）
