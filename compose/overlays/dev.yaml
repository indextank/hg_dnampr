# ========================
# 开发环境专用配置说明
# ========================
# 特性：
# 1. 单副本运行，最小资源分配
# 2. 调试工具集成（Xdebug等）
# 3. 详细日志记录
# 4. 本地代码热重载
# 5. 快速迭代配置

# PHP 运行时性能（开发环境）：将 env/php.env 的 PHP_DEV_* 映射为容器内统一变量名，
# 当 ENVIRONMENT=development 选中本 overlay 时自动加载。
# 真正写入 php.ini 的覆盖由 up.sh 生成 zz-profile-overrides.ini 并挂载到容器 conf.d。
x-php-perf-env: &php-perf-env
  PHP_MEMORY_LIMIT: ${PHP_DEV_MEMORY_LIMIT:-1024M}
  PHP_MAX_EXECUTION_TIME: ${PHP_DEV_MAX_EXECUTION_TIME:-300}
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_DEV_UPLOAD_MAX_FILESIZE:-128M}
  PHP_POST_MAX_SIZE: ${PHP_DEV_POST_MAX_SIZE:-128M}
  PHP_MAX_INPUT_VARS: ${PHP_DEV_MAX_INPUT_VARS:-5000}
  PHP_DISPLAY_ERRORS: ${PHP_DEV_DISPLAY_ERRORS:-On}
  PHP_ERROR_REPORTING: ${PHP_DEV_ERROR_REPORTING:-E_ALL}

services:
  nginx:
    extends:
      file: stacks/web.yaml
      service: nginx-server
    deploy:
      # 开发环境保持单副本，避免资源浪费
      # 建议值范围：1-2（本地多服务联调时可临时调整）
      replicas: 1
      resources:
        reservations:
          cpus: ${NGINX_DEV_RESERVATIONS_CPU:-0.1}
          memory: ${NGINX_DEV_RESERVATIONS_MEMORY:-64M}
    logging:
      # 开发日志配置（DEBUG级别）
      # max-size - 单个日志文件最大尺寸
      # max-file - 保留历史日志文件数量
      driver: "json-file"
      options:
        max-size: "10m" # 建议值：10-50MB
        max-file: "3" # 建议值：3-5个文件

